# Staging image build/push (ADR-0019 Compose-first).
# Does NOT auto-deploy to a real host without STAGING_SSH_HOST.
#
# Required secrets for remote deploy (all EXTERNAL — do not invent):
#   STAGING_SSH_HOST       — hostname/IP of staging VM
#   STAGING_SSH_USER       — SSH user
#   STAGING_SSH_KEY        — private key material
#   STAGING_COMPOSE_PATH   — remote path to compose project (optional)
# Optional:
#   GHCR_TOKEN             — only if GITHUB_TOKEN scopes are insufficient
#
# When SSH secrets are missing: build+push to GHCR only (if GITHUB_TOKEN
# available) and print EXTERNAL prerequisite for host deploy.

name: Staging deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: infrastructure/docker/base/Dockerfile.node
            build_args: APP_NAME=api
          - app: worker
            dockerfile: infrastructure/docker/base/Dockerfile.node
            build_args: APP_NAME=worker
          - app: ai-service
            dockerfile: infrastructure/docker/base/Dockerfile.node
            build_args: APP_NAME=ai-service
          - app: web
            dockerfile: infrastructure/docker/apps/Dockerfile.web
            build_args: NEXT_PUBLIC_API_BASE_URL=https://staging.example.com
          - app: admin
            dockerfile: infrastructure/docker/apps/Dockerfile.admin
            build_args: NEXT_PUBLIC_API_BASE_URL=https://staging.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/buying-bot-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ secrets.GITHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=staging-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.app }}

  remote-deploy:
    name: Remote staging host deploy
    runs-on: ubuntu-latest
    needs: build-push
    # Only attempt SSH deploy when host secret is configured.
    if: ${{ secrets.STAGING_SSH_HOST != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "EXTERNAL operator: pull GHCR images and restart compose on staging host."
            echo "Compose path: ${{ secrets.STAGING_COMPOSE_PATH }}"
            # Intentionally minimal — operators own host-specific pull/restart.

  note-no-host:
    name: Document EXTERNAL deploy prerequisite
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ secrets.STAGING_SSH_HOST == '' }}
    steps:
      - name: Print EXTERNAL gate
        run: |
          echo "Build/push completed (or attempted)."
          echo "EXTERNAL PREREQUISITE: set STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY"
          echo "to enable remote Compose restart. No production auto-deploy from this workflow."
          echo "Local staging: scripts/staging/up.sh with .env.staging"
