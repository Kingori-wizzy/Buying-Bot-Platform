services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: buyingbot
      POSTGRES_PASSWORD: buyingbot
      POSTGRES_DB: buyingbot
    volumes:
      - buyingbot_pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buyingbot -d buyingbot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      SERVICE_NAME: api
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://buyingbot:buyingbot@postgres:5432/buyingbot?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: replace-me-with-a-long-random-secret-in-real-deployments
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: worker
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker
      HOST: 0.0.0.0
      PORT: 3002
      LOG_LEVEL: info

  ai-service:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: ai-service
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      SERVICE_NAME: ai-service
      HOST: 0.0.0.0
      PORT: 3003
      LOG_LEVEL: info

volumes:
  buyingbot_pg_data:
