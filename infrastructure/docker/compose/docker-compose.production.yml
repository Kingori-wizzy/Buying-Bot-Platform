# Production stack — Hostinger VPS / Compose-first (ADR-0019). No Kubernetes.
# Usage (from repo root on the VPS):
#   cp .env.production.example /etc/buyingbot/env.production   # fill via secrets; chmod 600
#   docker compose -f infrastructure/docker/compose/docker-compose.production.yml \
#     --env-file /etc/buyingbot/env.production up -d --build
#
# Public ports: 80/443 via nginx ONLY.
# Postgres, Redis, MinIO, workers, AI are internal.

name: buyingbot-prod

x-app-env: &app-env
  NODE_ENV: production
  COOKIE_SECURE: 'true'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-buyingbot}
      TZ: ${TZ:-Africa/Nairobi}
      PGTZ: ${TZ:-Africa/Nairobi}
    volumes:
      - buyingbot_prod_pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - buyingbot_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # No host ports — not reachable from the Internet
    expose:
      - '5432'
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --save
      - '60'
      - '1000'
    volumes:
      - buyingbot_prod_redis_data:/data
    networks:
      - buyingbot_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
    expose:
      - '6379'
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - buyingbot_prod_minio_data:/data
    networks:
      - buyingbot_prod_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - '9000'
      - '9001'
    deploy:
      resources:
        limits:
          memory: 768M

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-buyingbot-media}
    entrypoint: >
      /bin/sh -c "
      set -e;
      i=0;
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\"; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then exit 1; fi;
        sleep 2;
      done;
      mc mb -p local/$$S3_BUCKET || true;
      mc anonymous set none local/$$S3_BUCKET || true;
      echo 'MinIO bucket ready';
      "
    networks:
      - buyingbot_prod_net
    restart: 'no'

  migrate:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: api
        NODE_VERSION: '22'
    restart: 'no'
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buyingbot}?schema=public&connection_limit=5
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/packages/database
    command:
      ['node', '/app/node_modules/prisma/build/index.js', 'migrate', 'deploy']
    networks:
      - buyingbot_prod_net

  api:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: api
        NODE_VERSION: '22'
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: api
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buyingbot}?schema=public&connection_limit=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${NEXT_PUBLIC_API_BASE_URL}}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_DRIVER: ${MEDIA_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-buyingbot-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      PAYMENT_PROVIDER: escrow
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      MPESA_ENABLED: 'false'
      MARKETPLACE_INGESTION_ENABLED: ${MARKETPLACE_INGESTION_ENABLED:-false}
      ESCROW_API_KEY: ${ESCROW_API_KEY:-}
      ESCROW_API_SECRET: ${ESCROW_API_SECRET:-}
      ESCROW_BASE_URL: ${ESCROW_BASE_URL:-}
      ESCROW_WEBHOOK_SECRET: ${ESCROW_WEBHOOK_SECRET:-}
      ESCROW_ALLOW_TEST_DOUBLE: 'false'
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-false}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-KES}
      TAX_REQUIRED: ${TAX_REQUIRED:-true}
      TAX_DEFAULT_RATE_BPS: ${TAX_DEFAULT_RATE_BPS:-1600}
      AI_SERVICE_BASE_URL: http://ai-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - buyingbot_prod_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: worker
        NODE_VERSION: '22'
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      HOST: 0.0.0.0
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buyingbot}?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAYMENT_PROVIDER: escrow
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      MPESA_ENABLED: 'false'
      MARKETPLACE_INGESTION_ENABLED: ${MARKETPLACE_INGESTION_ENABLED:-false}
      ESCROW_API_KEY: ${ESCROW_API_KEY:-}
      ESCROW_API_SECRET: ${ESCROW_API_SECRET:-}
      ESCROW_BASE_URL: ${ESCROW_BASE_URL:-}
      ESCROW_WEBHOOK_SECRET: ${ESCROW_WEBHOOK_SECRET:-}
      ESCROW_ALLOW_TEST_DOUBLE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - buyingbot_prod_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  ai-service:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/base/Dockerfile.node
      args:
        APP_NAME: ai-service
        NODE_VERSION: '22'
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: ai-service
      HOST: 0.0.0.0
      PORT: 3003
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is required}
      API_BASE_URL: http://api:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - buyingbot_prod_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/apps/Dockerfile.web
      args:
        NODE_VERSION: '22'
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - buyingbot_prod_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/apps/Dockerfile.admin
      args:
        NODE_VERSION: '22'
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - buyingbot_prod_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3004/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ../../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_HOST_DIR:-./certs}:/etc/nginx/certs:ro
      - buyingbot_prod_certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - buyingbot_prod_net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  buyingbot_prod_net:
    name: buyingbot_prod_net
    driver: bridge

volumes:
  buyingbot_prod_pg_data:
    name: buyingbot_prod_pg_data
  buyingbot_prod_redis_data:
    name: buyingbot_prod_redis_data
  buyingbot_prod_minio_data:
    name: buyingbot_prod_minio_data
  buyingbot_prod_certbot_www:
    name: buyingbot_prod_certbot_www
