# HELP buying_bot_up Process up
# TYPE buying_bot_up gauge
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: buying-bot-api
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics
  - job_name: buying-bot-ai
    static_configs:
      - targets: ['host.docker.internal:3003']
    metrics_path: /metrics
  - job_name: buying-bot-worker
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: /metrics
